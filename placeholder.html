<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Video</title>
<link id="icon" rel="icon" href="">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; height: 100vh; display: grid; place-items: center;
    font: 16px system-ui, sans-serif; background: #0f0f0f; color: #f1f1f1;
  }
  main { max-width: 40em; padding: 2em; text-align: center; }
  h1 { font-size: 1.4em; font-weight: 600; margin: 0 0 .5em; }
  p { color: #aaa; margin: 0 0 1.5em; }
  #status { color: #f88; margin: 1.5em 0 0; }
  button {
    font: inherit; padding: .6em 1.2em; border: 0; border-radius: 2em;
    background: #f1f1f1; color: #0f0f0f; cursor: pointer;
  }
  .gone .live, :not(.gone) > main > .orphan { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="live">Playing on your other screen.</p>
  <button class="live" id="back">Bring it back here</button>
  <p class="live" id="status" role="status"></p>
  <p class="orphan">This video is no longer popped out.</p>
  <button class="orphan" id="open">Open it here</button>
</main>
<script src="placeholder.js"></script>
</body>
</html>
